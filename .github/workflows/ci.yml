name: CI

on:
  pull_request:
    branches: [develop, main, release/current, 'epic/**']
  push:
    branches: [develop, release/current]

permissions:
  contents: read

# Em PR, um push novo cancela a rodada anterior da mesma branch; pushes em develop/release não são cancelados.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify
