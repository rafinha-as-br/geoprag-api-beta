services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-geoprag}
      POSTGRES_USER: ${DB_USER:-geoprag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geoprag}
    volumes:
      - geoprag-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # `local` carrega o seed fictício (usuários de teste). Para subir sem seed: SPRING_PROFILES_ACTIVE=default
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-geoprag}
      DB_USER: ${DB_USER:-geoprag}
      DB_PASSWORD: ${DB_PASSWORD:-geoprag}
      # Obrigatório: a API não sobe sem um segredo forte (veja .env.example).
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (segredo aleatorio com 32+ caracteres)}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

volumes:
  geoprag-db-data:
