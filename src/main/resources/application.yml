server:
  port: 8080

spring:
  application:
    name: geoprag-api-beta
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  web:
    # Mensagens de validação e erros ao usuário em pt-BR, independentemente do Accept-Language.
    locale: pt_BR
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Só o esquema. O seed fictício (db/seed) é acrescentado apenas pelos perfis `local` e `test`.
    locations: classpath:db/migration

# Endpoint de saúde: apenas /actuator/health é exposto.
management:
  endpoints:
    web:
      exposure:
        include: health

# Documentação navegável: Swagger UI em /swagger-ui.html e OpenAPI em /v3/api-docs.
springdoc:
  show-actuator: true

# Todas vêm somente de variáveis de ambiente; ver .env.example.
# jwt é lido pelas features de autenticação (épicos seguintes); cors é lido por common.cors.
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  sync:
    # Máximo de itens por lote em POST /api/v1/sync/aplicacoes (acima disso: 413 LOTE_MUITO_GRANDE).
    max-itens-por-lote: ${SYNC_MAX_ITENS_POR_LOTE:500}
    # Recuo do cursor do pull incremental (segundos), para não perder mudança de transação ainda não confirmada.
    margem-cursor-segundos: ${SYNC_MARGEM_CURSOR_SEGUNDOS:5}
  # Fuso de operação (datas de calendário, ex.: "hoje" ao validar a primeira aplicação); ainda não há fuso por tenant.
  fuso-horario: ${APP_FUSO_HORARIO:America/Sao_Paulo}
  ponto:
    # Teto de datas geradas em POST /api/v1/pontos/{id}/ativacao (acima disso: 400 VALIDACAO_INVALIDA).
    max-recorrencias: ${PONTO_MAX_RECORRENCIAS:365}
