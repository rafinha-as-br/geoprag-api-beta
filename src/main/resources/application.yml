server:
  port: 8080

spring:
  application:
    name: geoprag-api-beta
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Configurações lidas por features posteriores (autenticação e CORS).
# Todas vêm somente de variáveis de ambiente; ver .env.example.
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
